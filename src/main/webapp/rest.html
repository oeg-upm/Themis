<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Validate your ontology</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="language" content="English">
    <meta name="description" content="Themis is a web application for validating OWL/RDF ontology models by executing test suites derived from requirements.">
    <link rel="icon" type="image/png" href="images/themis.png">


    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <link rel="stylesheet" href="https://netdna.bootstrapcdn.com/bootstrap/3.1.1/css/bootstrap.min.css">
    <script src="https://netdna.bootstrapcdn.com/bootstrap/3.1.1/js/bootstrap.min.js"></script>


    <link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css">
    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.js"></script>

    <!-- Le styles -->
    <link href="vocab/css/bootstrap.css" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="vocab/css/style-custom.css">



</head>


<body>


<!-- Static navbar -->
<div id="header-placeholder"></div>


<div class="container" >
    <!-- Jumbotron -->
    <div class="jumbotron" style="background-color:white;" >
        <h2> Add Themis to your GitHub repository</h2>
    </div>

    <div class="container">
        <p>You can also add Themis to your GitHub repo as a webhook by login using your GitHub account.</p>

        <form method="get" action="rest/register/login">
            <div class="form-group">
                <div class="col-md-9">
                     <input type="text" class="form-control" id="uname" name="uname" placeholder="username/repo">
                </div>
                <div class="col-md-3">
                    <button type="submit" class="btn btn-primary mb-2" >Add service</button>
                </div>
            </div>
        </form>
    </div>

</div>


<div id="footer-placeholder"></div>

</body>
</html>
