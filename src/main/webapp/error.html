<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>REST Service for GitHub</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="language" content="English">
    <meta name="description" content="Themis is a web application for validating OWL/RDF ontology models by executing test suites derived from requirements.">
    <link rel="icon" type="image/png" href="images/themis-icon.png">


    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>

    <link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css">
    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.js"></script>

    <!-- Le styles -->
    <link href="vocab/css/bootstrap.css" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="vocab/css/style-custom.css">

</head>


<body>



<!-- Static navbar -->
<div id="header-placeholder"></div>
<div class="container" >
    <!-- Jumbotron -->
    <div class="jumbotron " >
        <h2> Add Themis to your GitHub repository</h2>
    </div>


    <div class="container">
        <p>You can also add Themis to your GitHub repo by login using your GitHub account.</p>
        <form method="get" action="rest/register/login">
            <div class="form-group">
                <div class="col-md-9">
                    <input type="text" class="form-control" id="uname" name="uname" placeholder="username/repo">
                </div>
                <div class="col-md-3">
                    <button type="submit" class="btn btn-primary">Add service</button>
                </div>
            </div>
        </form>

        <div class="container text-center" >
            <h2>Oops! An error has ocurred. Please check  you don't have the system deployed already </h2>
            <div class=" text-center">
                <button  class="btn btn-primary mb-2" formaction="https://github.com">Go to GitHub</button>

            </div>
        </div>

    </div>
    <br>
    <br>
    <br>
    <br>
    <br>

    <div id="footer-placeholder"></div>
</div>
<script type="text/javascript" src="js/tests-js.js"></script>
</body>
</html>
